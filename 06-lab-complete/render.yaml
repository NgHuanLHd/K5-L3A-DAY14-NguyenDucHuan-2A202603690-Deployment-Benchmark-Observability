# Render Blueprint cho agent Part 6.
# Đường dẫn Docker tính từ gốc repo, nên chỉ rõ thư mục 06-lab-complete.
services:
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      # Secret: nhập tay trên dashboard Render, không ghi giá trị vào file.
      - key: AGENT_API_KEY
        sync: false
      # Nối thẳng tới Redis bên dưới.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    ipAllowList: []   # chỉ cho phép kết nối nội bộ trong Render
